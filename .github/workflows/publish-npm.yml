name: Publish npm package

# Publishes via npm trusted publishing (OIDC). No npm token is used: npm
# verifies the GitHub Actions OIDC token against the trusted publisher
# configured on npmjs.com (repo getsupertab/connect-sdk-typescript, workflow
# publish-npm.yml, environment npm-release) and generates provenance itself.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 24 bundles npm 11.x.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' is not valid semver (expected vX.Y.Z with optional prerelease/build metadata)"
            exit 1
          fi

      - name: Verify tag version matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "Tag version (${TAG_VERSION}) does not match package.json version (${PACKAGE_VERSION})"
            exit 1
          fi

      - name: Determine npm dist-tag
        # npm 11 refuses to publish without --tag when the version is lower
        # than the current latest, and would otherwise tag a prerelease as
        # latest. Stable releases go to "latest"; prereleases go to their
        # identifier (v2.5.0-beta.1 -> "beta"), or "next" if it is not a
        # usable tag name.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            PRERELEASE="${PRERELEASE%%+*}"
            IDENTIFIER="${PRERELEASE%%.*}"
            if [[ "${IDENTIFIER}" =~ ^[A-Za-z][0-9A-Za-z-]*$ ]]; then
              DIST_TAG="${IDENTIFIER}"
            else
              DIST_TAG="next"
            fi
          else
            DIST_TAG="latest"
          fi
          echo "Publishing ${VERSION} with dist-tag '${DIST_TAG}'"
          echo "DIST_TAG=${DIST_TAG}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish package to npm (OIDC trusted publishing)
        run: npm publish --access public --tag "${DIST_TAG}"
