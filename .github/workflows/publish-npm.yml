name: Publish npm package

# Publishes via npm trusted publishing (OIDC). No npm token is used: npm
# verifies the GitHub Actions OIDC token against the trusted publisher
# configured on npmjs.com (repo getsupertab/connect-sdk-typescript, workflow
# publish-npm.yml, environment npm-release) and generates provenance itself.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: # dry run only: verifies the OIDC exchange without publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 24 bundles npm 11.x.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release tag format
        if: github.event_name == 'push'
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' is not valid semver (expected vX.Y.Z with optional prerelease/build metadata)"
            exit 1
          fi

      - name: Verify tag version matches package.json
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "Tag version (${TAG_VERSION}) does not match package.json version (${PACKAGE_VERSION})"
            exit 1
          fi

      - name: Determine npm dist-tag
        # npm 11 refuses to publish without --tag when the version is lower
        # than the current latest, and would otherwise tag a prerelease as
        # latest. Stable releases go to "latest"; prereleases go to their
        # identifier (v2.5.0-beta.1 -> "beta"), or "next" if the identifier
        # is not a usable tag name: it must start with a letter and must not
        # be a semver range (the registry rejects tags such as v1, x, vx).
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          CORE="${VERSION%%+*}"  # drop build metadata before looking for a prerelease
          if [[ "${CORE}" == *-* ]]; then
            IDENTIFIER="${CORE#*-}"
            IDENTIFIER="${IDENTIFIER%%.*}"
            if [[ "${IDENTIFIER}" =~ ^[A-Za-z][0-9A-Za-z-]*$ && ! "${IDENTIFIER}" =~ ^v*([0-9]+|[xX])$ ]]; then
              DIST_TAG="${IDENTIFIER}"
            else
              DIST_TAG="next"
            fi
          else
            DIST_TAG="latest"
          fi
          echo "Publishing ${VERSION} with dist-tag '${DIST_TAG}'"
          echo "DIST_TAG=${DIST_TAG}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish package to npm (OIDC trusted publishing)
        if: github.event_name == 'push'
        run: npm publish --access public --tag "${DIST_TAG}"

      - name: Dry run publish (verify OIDC trusted publishing)
        if: github.event_name == 'workflow_dispatch'
        # npm runs the OIDC token exchange before honouring --dry-run, so this
        # exercises the trusted publisher config without uploading anything.
        # The exchange never fails the command on its own (npm falls back to a
        # "requires you to be logged in (dry-run)" warning), so assert on the
        # verbose log instead.
        run: |
          npm publish --access public --tag "${DIST_TAG}" --dry-run --loglevel verbose 2>&1 | tee publish.log
          if ! grep -q "Successfully retrieved and set token" publish.log; then
            echo "OIDC token exchange with npm failed. Check the trusted publisher config on npmjs.com."
            grep -i "oidc" publish.log || true
            exit 1
          fi
